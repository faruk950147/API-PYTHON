{% extends 'base.html' %}
{% block title %} Admission List {% endblock title %}

{% block main %}
<main class="main">
    <div class="container">
        <div class="row justify-content-center align-items-center mt-5">
            <div class="col-12">
                <h1>Admission List</h1>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>DOB</th>
                            <th>GPA</th>
                            <th>Qualification</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="admission_table_body">
                        <!-- AJAX data will go here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
{% endblock main %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Load Admissions
    function loadAdmissions() {
        fetch('/apis/admissions/')
        .then(res => res.json())
        .then(data => {
            admission_table_body.innerHTML = '';
            data.forEach(adm => {
                const row = document.createElement('tr');
                row.id = `row-${adm.id}`;
                row.innerHTML = `
                    <td>${adm.name}</td>
                    <td>${adm.dob}</td>
                    <td>${adm.gpa}</td>
                    <td>${adm.qualification}</td>
                    <td>${adm.gender}</td>
                    <td>${adm.department}</td>
                    <td>${adm.status}</td>
                    <td>
                        <button class="btn btn-warning btn-sm edit-btn" data-id="${adm.id}">Edit</button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="${adm.id}">Delete</button>
                    </td>
                `;
                admission_table_body.appendChild(row);
            });
        });
    }

    loadAdmissions();
});

</script>
{% endblock extra_scripts %}
